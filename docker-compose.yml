services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8000
      - WORKERS=2
      - CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stylemirror-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stylemirror-net

  # Optional HTTPS reverse proxy profile (Caddy)
  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    restart: unless-stopped
    ports:
      - "443:443"
      - "8443:8443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    command: >
      caddy reverse-proxy --from :443 --to web:80
    depends_on:
      web:
        condition: service_healthy
    networks:
      - stylemirror-net

networks:
  stylemirror-net:
    driver: bridge
