server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml model/gltf-binary application/wasm;

    # Security response headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed static assets - 1 year cache
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3D models and WebAssembly modules with explicit MIME types
    location ~* \.glb$ {
        add_header Content-Type "model/gltf-binary" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.wasm$ {
        add_header Content-Type "application/wasm" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Reverse proxy to backend API service
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # SPA route fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
